<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Flappy Bird – Deluxe</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
    canvas{display:block;image-rendering:pixelated;touch-action:none;}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const BASE_W = 360, BASE_H = 640;
let scale = 1, offX = 0, offY = 0;

function resize(){
  const sw = window.innerWidth, sh = window.innerHeight;
  scale = Math.min(sw/BASE_W, sh/BASE_H);
  canvas.width  = Math.round(BASE_W * scale);
  canvas.height = Math.round(BASE_H * scale);
  offX = (sw - canvas.width) /2;
  offY = (sh - canvas.height)/2;
  canvas.style.position = 'absolute';
  canvas.style.left = offX + 'px';
  canvas.style.top  = offY + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── AUDIO (Web Audio) ──────────────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, dur, vol, gain2){
  vol = vol||0.25; gain2 = gain2||0;
  try{
    const ac = getAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(gain2) o.frequency.exponentialRampToValueAtTime(gain2, ac.currentTime+dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
function sfxFlap()  { playTone(440,'sine',0.1,0.15,880); }
function sfxScore() { playTone(880,'sine',0.15,0.2,1200); }
function sfxDie()   { playTone(200,'sawtooth',0.4,0.3,60); }

// ─── PALETTE ────────────────────────────────────────────────────────────────
const C = {
  sky1:'#70c5ce', sky2:'#a8e6f0',
  ground:'#ded895', groundDark:'#bfb16e',
  pipe:'#73bf2e', pipeDark:'#4a8f1c', pipeCap:'#5aad1e',
  bird:'#f9d71c', birdDark:'#c8a800', birdEye:'#fff', birdPupil:'#333',
  birdBeak:'#e88e2c', birdBlush:'#f0a0a0',
  white:'#fff', shadow:'rgba(0,0,0,0.15)',
  overlay:'rgba(0,0,0,0.45)',
  gold:'#ffd700', orange:'#ff8c00',
  red:'#e74c3c',
};

// ─── GAME CONSTANTS ──────────────────────────────────────────────────────────
const W = BASE_W, H = BASE_H;
const GROUND_H = 80;
const GROUND_Y = H - GROUND_H;
const PIPE_W = 52;
const PIPE_GAP = 150;
const PIPE_SPEED_INIT = 2.2;
const PIPE_SPEED_MAX  = 4.5;
const PIPE_INTERVAL   = 90;
const GRAVITY         = 0.42;
const FLAP_VEL        = -7.5;
const BIRD_X          = 80;
const BIRD_R          = 16;
const MAX_ANGLE       = 70;
const MIN_ANGLE       = -25;

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = 'waiting';
let birdY, birdVY, birdAngle;
let pipes, frameCount, score, pipeTimer;
let particles = [];
let groundX = 0;
let deadTimer = 0;
let flashAlpha = 0;
let bobAngle = 0;
let _highScore = 0;
let wingPhase = 0;

function initGame(){
  birdY      = H/2 - 30;
  birdVY     = 0;
  birdAngle  = 0;
  pipes      = [];
  frameCount = 0;
  score      = 0;
  pipeTimer  = PIPE_INTERVAL;
  particles  = [];
  deadTimer  = 0;
  flashAlpha = 0;
  bobAngle   = 0;
  wingPhase  = 0;
}

// ─── PIPE HELPERS ────────────────────────────────────────────────────────────
function spawnPipe(){
  const minTop = 80, maxTop = GROUND_Y - PIPE_GAP - 80;
  const topH = minTop + Math.random()*(maxTop - minTop);
  pipes.push({ x: W+10, topH, passed: false });
}

function pipeSpeed(){
  return Math.min(PIPE_SPEED_INIT + score*0.06, PIPE_SPEED_MAX);
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function spawnParticles(x, y, count, colors){
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 1+Math.random()*4;
    particles.push({
      x,y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 2,
      life:1, decay: 0.02+Math.random()*0.03,
      r: 3+Math.random()*5,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15;
    p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ─── COLLISION ───────────────────────────────────────────────────────────────
function checkCollision(){
  if(birdY + BIRD_R >= GROUND_Y || birdY - BIRD_R <= 0) return true;
  for(const p of pipes){
    if(BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W){
      if(birdY - BIRD_R < p.topH || birdY + BIRD_R > p.topH + PIPE_GAP) return true;
    }
  }
  return false;
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function flap(){
  if(state === 'dead') return;
  if(state === 'waiting') state = 'playing';
  birdVY = FLAP_VEL;
  sfxFlap();
  spawnParticles(BIRD_X-10, birdY+8, 5, ['#fff','#70c5ce','#a8e6f0']);
}

document.addEventListener('keydown', function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); flap(); }
});
canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  if(state==='dead' && deadTimer>40){ initGame(); state='waiting'; return; }
  flap();
});

// ─── DRAWING HELPERS ─────────────────────────────────────────────────────────
function drawSky(){
  const gr = ctx.createLinearGradient(0,0,0,GROUND_Y*scale);
  gr.addColorStop(0,C.sky1); gr.addColorStop(1,C.sky2);
  ctx.fillStyle=gr; ctx.fillRect(0,0,W*scale,GROUND_Y*scale);
}

function drawCloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,0.82)';
  var pts = [[0,0,24],[20,0,20],[-20,0,20],[10,-14,16],[-10,-14,16]];
  for(var i=0;i<pts.length;i++){
    ctx.beginPath(); ctx.arc((x+pts[i][0]*s)*scale,(y+pts[i][1]*s)*scale,pts[i][2]*s*scale,0,Math.PI*2); ctx.fill();
  }
}

var cloudX = [80, 200, 320];
function updateDrawClouds(){
  var spd = state==='playing' ? 1 : 0.5;
  for(var i=0;i<cloudX.length;i++){
    cloudX[i] -= (0.3 + i*0.1)*spd;
    drawCloud(cloudX[i], [100,80,120][i], [0.6,0.8,0.5][i]);
    if(cloudX[i] < -80) cloudX[i] = W+100;
  }
}

function drawGround(){
  ctx.fillStyle=C.ground; ctx.fillRect(0,GROUND_Y*scale,W*scale,GROUND_H*scale);
  ctx.fillStyle=C.groundDark; ctx.fillRect(0,GROUND_Y*scale,W*scale,14*scale);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  for(var x=((groundX|0)%32)-32;x<W+32;x+=32){
    ctx.fillRect(x*scale,(GROUND_Y+4)*scale,20*scale,6*scale);
  }
}

function drawPipe(p){
  var capH=22, capW=PIPE_W+8, capOff=(capW-PIPE_W)/2;
  var botY=p.topH+PIPE_GAP, botH=GROUND_Y-botY;
  // Top pipe body
  ctx.fillStyle=C.pipe; ctx.fillRect(p.x*scale,0,PIPE_W*scale,(p.topH-capH)*scale);
  ctx.fillStyle=C.pipeDark; ctx.fillRect((p.x+PIPE_W-10)*scale,0,10*scale,(p.topH-capH)*scale);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect((p.x+4)*scale,0,8*scale,(p.topH-capH)*scale);
  // Top cap
  ctx.fillStyle=C.pipeCap; ctx.fillRect((p.x-capOff)*scale,(p.topH-capH)*scale,capW*scale,capH*scale);
  ctx.fillStyle=C.pipeDark; ctx.fillRect((p.x-capOff+capW-10)*scale,(p.topH-capH)*scale,10*scale,capH*scale);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect((p.x-capOff+4)*scale,(p.topH-capH+3)*scale,8*scale,(capH-6)*scale);
  // Bottom pipe body
  ctx.fillStyle=C.pipe; ctx.fillRect(p.x*scale,(botY+capH)*scale,PIPE_W*scale,(botH-capH)*scale);
  ctx.fillStyle=C.pipeDark; ctx.fillRect((p.x+PIPE_W-10)*scale,(botY+capH)*scale,10*scale,(botH-capH)*scale);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect((p.x+4)*scale,(botY+capH)*scale,8*scale,(botH-capH)*scale);
  // Bottom cap
  ctx.fillStyle=C.pipeCap; ctx.fillRect((p.x-capOff)*scale,botY*scale,capW*scale,capH*scale);
  ctx.fillStyle=C.pipeDark; ctx.fillRect((p.x-capOff+capW-10)*scale,botY*scale,10*scale,capH*scale);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect((p.x-capOff+4)*scale,(botY+3)*scale,8*scale,(capH-6)*scale);
}

function drawBird(x, y, angle, wp){
  ctx.save();
  ctx.translate(x*scale, y*scale);
  ctx.rotate(angle*Math.PI/180);
  var s=scale;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.13)';
  ctx.beginPath(); ctx.ellipse(0,18*s,14*s,5*s,0,0,Math.PI*2); ctx.fill();
  // Wing
  var wingY = Math.sin(wp)*6;
  ctx.fillStyle=C.birdDark;
  ctx.beginPath(); ctx.ellipse(-4*s,(8+wingY)*s,12*s,7*s,-0.3,0,Math.PI*2); ctx.fill();
  // Body gradient
  var gr=ctx.createRadialGradient(-4*s,-4*s,2*s,0,0,18*s);
  gr.addColorStop(0,'#fff176'); gr.addColorStop(1,C.birdDark);
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(0,0,17*s,0,Math.PI*2); ctx.fill();
  // Belly highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(2*s,4*s,8*s,6*s,0,0,Math.PI*2); ctx.fill();
  // Blush
  ctx.fillStyle=C.birdBlush; ctx.globalAlpha=0.6;
  ctx.beginPath(); ctx.ellipse(7*s,6*s,5*s,3*s,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  // Eye
  ctx.fillStyle=C.birdEye; ctx.beginPath(); ctx.arc(7*s,-4*s,6*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.birdPupil; ctx.beginPath(); ctx.arc(8.5*s,-4*s,3*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10*s,-6*s,1.5*s,0,Math.PI*2); ctx.fill();
  // Beak
  ctx.fillStyle=C.birdBeak;
  ctx.beginPath(); ctx.moveTo(12*s,-1*s); ctx.lineTo(22*s,2*s); ctx.lineTo(12*s,5*s); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c06810'; ctx.fillRect(12*s,2*s,10*s,1.5*s);
  ctx.restore();
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.save();
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x*scale,p.y*scale,p.r*scale,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawScore(){
  ctx.save();
  ctx.font='bold '+Math.round(40*scale)+'px "Arial Black",Arial,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=6*scale; ctx.shadowOffsetY=3*scale;
  ctx.fillStyle='#fff';
  ctx.fillText(String(score), W/2*scale, 30*scale);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawWaitingScreen(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // Title panel
  var pw=200,ph=54,px=(W-pw)/2,py=88;
  roundRect(px*scale,py*scale,pw*scale,ph*scale,12*scale);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2*scale; ctx.stroke();
  ctx.font='bold '+Math.round(26*scale)+'px "Arial Black",Arial,sans-serif';
  ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=8*scale;
  ctx.fillText('FLAPPY BIRD', W/2*scale, (py+27)*scale);
  // Tap hint
  var alpha=0.5+0.5*Math.sin(frameCount*0.08);
  ctx.globalAlpha=alpha; ctx.shadowBlur=4*scale;
  ctx.font='bold '+Math.round(17*scale)+'px Arial,sans-serif';
  ctx.fillText('TAP / SPACE TO START', W/2*scale, (GROUND_Y/2+90)*scale);
  // High score
  if(_highScore>0){
    ctx.globalAlpha=0.85; ctx.shadowBlur=3*scale;
    ctx.font=Math.round(14*scale)+'px Arial,sans-serif';
    ctx.fillText('BEST: '+_highScore, W/2*scale, (GROUND_Y/2+118)*scale);
  }
  ctx.restore();
}

function drawDeadScreen(){
  ctx.save();
  ctx.fillStyle=C.overlay; ctx.fillRect(0,0,W*scale,H*scale);
  var pw=240,ph=190,px=(W-pw)/2,py=(H-ph)/2-20;
  roundRect(px*scale,py*scale,pw*scale,ph*scale,16*scale);
  var gr=ctx.createLinearGradient(0,py*scale,0,(py+ph)*scale);
  gr.addColorStop(0,'#fffde7'); gr.addColorStop(1,'#fff9c4');
  ctx.fillStyle=gr; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=2*scale; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // Game Over
  ctx.font='bold '+Math.round(26*scale)+'px "Arial Black",Arial,sans-serif';
  ctx.fillStyle=C.red; ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=4*scale;
  ctx.fillText('GAME OVER', W/2*scale, (py+30)*scale);
  // Score labels
  ctx.font=Math.round(15*scale)+'px Arial,sans-serif';
  ctx.fillStyle='#666'; ctx.shadowBlur=0;
  ctx.fillText('SCORE',(W/2-50)*scale,(py+72)*scale);
  ctx.fillText('BEST',(W/2+50)*scale,(py+72)*scale);
  // Values
  ctx.font='bold '+Math.round(30*scale)+'px "Arial Black",Arial,sans-serif';
  ctx.fillStyle='#333';
  ctx.fillText(score,(W/2-50)*scale,(py+102)*scale);
  var isBest=score>=_highScore&&score>0;
  ctx.fillStyle=isBest?C.orange:'#333';
  ctx.fillText(_highScore,(W/2+50)*scale,(py+102)*scale);
  if(isBest){
    ctx.font='bold '+Math.round(12*scale)+'px Arial';
    ctx.fillStyle=C.gold;
    ctx.fillText('★ NEW BEST!',(W/2+50)*scale,(py+126)*scale);
  }
  // Divider
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.fillRect((px+20)*scale,(py+148)*scale,(pw-40)*scale,1*scale);
  // Retry hint
  if(deadTimer>40){
    ctx.globalAlpha=0.5+0.5*Math.sin(frameCount*0.1);
    ctx.font='bold '+Math.round(14*scale)+'px Arial,sans-serif';
    ctx.fillStyle='#444';
    ctx.fillText('TAP TO PLAY AGAIN',W/2*scale,(py+170)*scale);
  }
  ctx.restore();
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function update(){
  frameCount++;

  if(state==='waiting'){
    bobAngle+=0.06;
    birdY=H/2-30+Math.sin(bobAngle)*8;
    birdAngle=Math.sin(bobAngle)*8;
    wingPhase+=0.18;
    groundX-=1;
    if(groundX<-32) groundX+=32;
    return;
  }

  if(state==='dead'){
    deadTimer++;
    birdVY=Math.min(birdVY+GRAVITY*1.5,18);
    birdY+=birdVY;
    birdAngle=Math.min(birdAngle+4,MAX_ANGLE);
    wingPhase=0;
    if(flashAlpha>0) flashAlpha=Math.max(0,flashAlpha-0.06);
    updateParticles();
    groundX-=0.5;
    if(groundX<-32) groundX+=32;
    return;
  }

  // playing
  birdVY=Math.min(birdVY+GRAVITY,14);
  birdY+=birdVY;
  wingPhase+=birdVY<0?0.35:0.12;
  birdAngle=birdVY<0?Math.max(birdAngle-6,MIN_ANGLE):Math.min(birdAngle+3,MAX_ANGLE);

  pipeTimer--;
  if(pipeTimer<=0){ spawnPipe(); pipeTimer=PIPE_INTERVAL; }

  var spd=pipeSpeed();
  for(var i=pipes.length-1;i>=0;i--){
    pipes[i].x-=spd;
    if(!pipes[i].passed && pipes[i].x+PIPE_W<BIRD_X){
      pipes[i].passed=true; score++;
      sfxScore();
      spawnParticles(BIRD_X,birdY-20,8,[C.gold,'#fff',C.orange]);
    }
    if(pipes[i].x+PIPE_W<-20) pipes.splice(i,1);
  }

  groundX-=spd;
  if(groundX<-32) groundX+=32;
  updateParticles();
  if(flashAlpha>0) flashAlpha=Math.max(0,flashAlpha-0.05);

  if(checkCollision()){
    state='dead';
    sfxDie();
    if(score>_highScore) _highScore=score;
    flashAlpha=1;
    spawnParticles(BIRD_X,birdY,20,[C.bird,C.birdDark,'#fff',C.orange]);
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSky();
  updateDrawClouds();
  for(var i=0;i<pipes.length;i++) drawPipe(pipes[i]);
  drawGround();
  drawBird(BIRD_X,birdY,birdAngle,wingPhase);
  drawParticles();
  if(flashAlpha>0){
    ctx.save(); ctx.globalAlpha=flashAlpha*0.7;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W*scale,H*scale);
    ctx.restore();
  }
  if(state==='playing') drawScore();
  if(state==='waiting') drawWaitingScreen();
  if(state==='dead'){ drawScore(); drawDeadScreen(); }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
