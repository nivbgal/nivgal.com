<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0F1A">
  <title>nivgal.com  -  Not found</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=3">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&f[]=satoshi@400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0A0F1A;
      --surface: #171718;
      --ink: #EDECE8;
      --muted: #9A9890;
      --line: rgba(237, 236, 232, 0.12);
      --line-strong: rgba(237, 236, 232, 0.22);
      --accent: #60A5FA;
      --accent-ink: #140A06;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Satoshi", ui-sans-serif, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(520px, 100%);
      padding: 40px 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .kicker::before { content: ""; width: 22px; height: 1.5px; background: var(--accent); }
    h1 {
      margin: 18px 0 8px;
      font-family: "Cabinet Grotesk", sans-serif;
      font-weight: 900;
      font-size: clamp(3rem, 14vw, 5rem);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    p { margin: 0 0 26px; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease;
    }
    a:hover, a:focus-visible { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="kicker">Error 404</span>
    <h1>Off the pitch.</h1>
    <p>This route isn't live yet. Let's get you back to the signal room.</p>
    <a href="index.html">← Return home</a>
  </main>
</body>
</html>
