<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1A">
  <title>Pulse — Tap Game</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800,900&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0F1A;
      --surface: #111827;
      --ink: #EDECE8;
      --muted: #9A9890;
      --accent: #60A5FA;
      --accent-ink: #061018;
      --line: rgba(237, 236, 232, 0.12);
      --good: #3DDC97;
      --font-d: "Cabinet Grotesk", "Satoshi", sans-serif;
      --font-b: "Satoshi", ui-sans-serif, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-b);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    #app {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    canvas#fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* HUD */
    .hud {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 0;
      pointer-events: none;
    }
    .hud-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hud-value {
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 1.55rem;
      line-height: 1;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: -0.02em;
    }
    .hud-value.accent { color: var(--accent); }
    .hud-right { text-align: right; }
    .hud-center {
      flex: 1;
      text-align: center;
      align-items: center;
    }
    .timer-ring {
      width: 56px;
      height: 56px;
      position: relative;
      margin: 0 auto;
    }
    .timer-ring svg {
      width: 56px;
      height: 56px;
      transform: rotate(-90deg);
    }
    .timer-ring circle {
      fill: none;
      stroke-width: 4;
    }
    .timer-ring .track { stroke: var(--line); }
    .timer-ring .prog {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 80ms linear;
    }
    .timer-num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }

    .mute-btn {
      pointer-events: auto;
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(23, 23, 24, 0.85);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      backdrop-filter: blur(8px);
    }
    .mute-btn:active { transform: scale(0.94); }

    /* Main stage */
    .stage {
      position: relative;
      z-index: 4;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 20px 28px;
      min-height: 0;
    }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      text-align: center;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255, 90, 53, 0.08), transparent 70%), var(--bg);
    }
    .screen[hidden] { display: none !important; }

    .brand {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      display: grid;
      place-items: center;
      margin-bottom: 20px;
    }
    .brand svg { width: 26px; height: 26px; }

    .screen h1 {
      font-family: var(--font-d);
      font-weight: 900;
      font-size: clamp(2.4rem, 12vw, 3.4rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin-bottom: 10px;
    }
    .screen h1 span { color: var(--accent); }
    .screen .tagline {
      color: var(--muted);
      font-size: 0.98rem;
      font-weight: 500;
      max-width: 280px;
      line-height: 1.45;
      margin-bottom: 28px;
    }

    .big-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      padding: 16px 36px;
      min-height: 54px;
      min-width: 200px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 10px 30px rgba(255, 90, 53, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .big-btn:hover { transform: translateY(-1px); }
    .big-btn:active { transform: scale(0.97); }

    .hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .end-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(320px, 100%);
      margin: 0 0 28px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 8px;
    }
    .stat strong {
      display: block;
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat span {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .record-banner {
      margin-bottom: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(61, 220, 151, 0.12);
      border: 1px solid rgba(61, 220, 151, 0.35);
      color: var(--good);
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .record-banner[hidden] { display: none !important; }

    /* Play pad */
    .pad-wrap {
      position: relative;
      width: min(280px, 72vw);
      aspect-ratio: 1;
      max-height: min(280px, 48vh);
    }
    .pad {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      background:
        radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 58%),
        var(--surface);
      box-shadow:
        0 0 0 12px color-mix(in srgb, var(--accent) 8%, transparent),
        0 20px 50px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      transition: transform 60ms ease, box-shadow 100ms ease;
    }
    .pad:active,
    .pad.is-hit {
      transform: scale(0.94);
      box-shadow:
        0 0 0 18px color-mix(in srgb, var(--accent) 14%, transparent),
        0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .pad-core {
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 8px 24px rgba(255, 90, 53, 0.45);
      pointer-events: none;
    }
    .pad-label {
      position: absolute;
      bottom: 18%;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }
    .combo-pop {
      position: absolute;
      left: 50%;
      top: 6%;
      transform: translateX(-50%);
      font-family: var(--font-d);
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }
    .combo-pop.show {
      animation: comboUp 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes comboUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-28px) scale(1.1); }
    }

    .play-hint {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
    }

    .tps {
      margin-top: 8px;
      font-family: var(--font-d);
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .pad, .big-btn, .combo-pop { transition: none; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <button class="mute-btn" id="muteBtn" type="button" aria-label="Toggle sound" title="Mute">🔊</button>
    <canvas id="fx" aria-hidden="true"></canvas>

    <!-- Title -->
    <div class="screen" id="titleScreen">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="10" stroke="#60A5FA" stroke-width="2.5"/>
          <circle cx="16" cy="16" r="4" fill="#60A5FA"/>
        </svg>
      </div>
      <h1>Pulse<span>.</span></h1>
      <p class="tagline">Tap as fast as you can before the live window closes. Beat the house record.</p>
      <button class="big-btn" id="startBtn" type="button">Tap to start</button>
      <p class="hint">10 seconds · multi-touch friendly · mobile-first</p>
    </div>

    <!-- Play -->
    <div id="playScreen" hidden>
      <div class="hud">
        <div class="hud-block">
          <span class="hud-label">Score</span>
          <span class="hud-value accent" id="scoreEl">0</span>
        </div>
        <div class="hud-block hud-center">
          <div class="timer-ring" aria-hidden="true">
            <svg viewBox="0 0 56 56">
              <circle class="track" cx="28" cy="28" r="24"></circle>
              <circle class="prog" id="timerArc" cx="28" cy="28" r="24"
                stroke-dasharray="150.8" stroke-dashoffset="0"></circle>
            </svg>
            <div class="timer-num" id="timerEl">10</div>
          </div>
        </div>
        <div class="hud-block hud-right">
          <span class="hud-label">Best</span>
          <span class="hud-value" id="bestEl">0</span>
        </div>
      </div>

      <div class="stage">
        <div class="combo-pop" id="comboPop"></div>
        <div class="pad-wrap">
          <button class="pad" id="pad" type="button" aria-label="Tap pad">
            <span class="pad-core" aria-hidden="true"></span>
            <span class="pad-label">Tap</span>
          </button>
        </div>
        <p class="play-hint" id="playHint">Go. Don't stop.</p>
        <p class="tps" id="tpsEl">0 taps/s</p>
      </div>
    </div>

    <!-- End -->
    <div class="screen" id="endScreen" hidden>
      <p class="record-banner" id="recordBanner" hidden>New personal best</p>
      <h1 style="font-size: clamp(1.8rem, 8vw, 2.4rem); margin-bottom: 8px;">Time's up.</h1>
      <p class="tagline" id="endTagline" style="margin-bottom: 22px;">Nice hands.</p>
      <div class="end-stats">
        <div class="stat"><strong id="endScore">0</strong><span>Taps</span></div>
        <div class="stat"><strong id="endTps">0</strong><span>Peak t/s</span></div>
        <div class="stat"><strong id="endBest">0</strong><span>Best</span></div>
      </div>
      <button class="big-btn" id="againBtn" type="button">Play again</button>
      <p class="hint">House record to beat: <span id="houseEl">80</span></p>
    </div>
  </div>

  <script>
(function () {
  "use strict";

  var DURATION = 10;
  var HOUSE = 80;
  var CIRC = 2 * Math.PI * 24;

  var titleScreen = document.getElementById("titleScreen");
  var playScreen = document.getElementById("playScreen");
  var endScreen = document.getElementById("endScreen");
  var startBtn = document.getElementById("startBtn");
  var againBtn = document.getElementById("againBtn");
  var pad = document.getElementById("pad");
  var scoreEl = document.getElementById("scoreEl");
  var bestEl = document.getElementById("bestEl");
  var timerEl = document.getElementById("timerEl");
  var timerArc = document.getElementById("timerArc");
  var tpsEl = document.getElementById("tpsEl");
  var comboPop = document.getElementById("comboPop");
  var endScore = document.getElementById("endScore");
  var endTps = document.getElementById("endTps");
  var endBest = document.getElementById("endBest");
  var endTagline = document.getElementById("endTagline");
  var recordBanner = document.getElementById("recordBanner");
  var houseEl = document.getElementById("houseEl");
  var muteBtn = document.getElementById("muteBtn");
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");

  houseEl.textContent = String(HOUSE);

  var best = 0;
  var muted = false;
  var running = false;
  var score = 0;
  var t0 = 0;
  var left = DURATION;
  var peakTps = 0;
  var tapTimes = [];
  var particles = [];
  var floats = [];
  var activePointers = Object.create(null);
  var audioCtx = null;
  var raf = 0;
  var lastComboShow = 0;

  // ── Audio ──
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function blip(freq, dur, type, vol) {
    if (muted || !audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function tapSound(n) {
    var base = 220 + Math.min(n, 40) * 8;
    blip(base, 0.05, "square", 0.07);
    blip(base * 1.5, 0.04, "triangle", 0.04);
  }

  function endSound(good) {
    if (good) {
      blip(523, 0.1, "triangle", 0.1);
      setTimeout(function () { blip(659, 0.12, "triangle", 0.1); }, 80);
      setTimeout(function () { blip(784, 0.18, "triangle", 0.12); }, 160);
    } else {
      blip(180, 0.2, "sawtooth", 0.06);
    }
  }

  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
    if (!muted) ensureAudio();
  });

  // ── Canvas particles ──
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var COLORS = ["#60A5FA", "#93C5FD", "#BFDBFE", "#3DDC97", "#EDECE8", "#38BDF8"];

  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 2 + Math.random() * 7;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2,
        life: 1,
        decay: 0.018 + Math.random() * 0.025,
        r: 2 + Math.random() * 4,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        g: 0.15 + Math.random() * 0.2
      });
    }
  }

  function floatText(x, y, text) {
    floats.push({ x: x, y: y, text: text, life: 1, vy: -1.2 });
  }

  function tickFx() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.g;
      p.vx *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.font = "800 18px Cabinet Grotesk, Satoshi, sans-serif";
    ctx.textAlign = "center";
    for (var j = floats.length - 1; j >= 0; j--) {
      var f = floats[j];
      f.y += f.vy;
      f.life -= 0.025;
      if (f.life <= 0) { floats.splice(j, 1); continue; }
      ctx.globalAlpha = f.life;
      ctx.fillStyle = "#60A5FA";
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    raf = requestAnimationFrame(tickFx);
  }
  raf = requestAnimationFrame(tickFx);

  // ── Game flow ──
  function show(el) {
    titleScreen.hidden = el !== titleScreen;
    playScreen.hidden = el !== playScreen;
    endScreen.hidden = el !== endScreen;
  }

  function currentTps() {
    var now = performance.now();
    tapTimes = tapTimes.filter(function (t) { return now - t < 1000; });
    return tapTimes.length;
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    var tps = currentTps();
    if (tps > peakTps) peakTps = tps;
    tpsEl.textContent = tps + " taps/s";

    var pct = Math.max(0, left / DURATION);
    timerArc.style.strokeDasharray = String(CIRC);
    timerArc.style.strokeDashoffset = String(CIRC * (1 - pct));
    timerEl.textContent = String(Math.ceil(Math.max(0, left)));
  }

  function onTap(clientX, clientY) {
    if (!running) return;
    score += 1;
    tapTimes.push(performance.now());
    tapSound(score);

    var x = clientX;
    var y = clientY;
    if (x == null || y == null) {
      var rect = pad.getBoundingClientRect();
      x = rect.left + rect.width / 2;
      y = rect.top + rect.height / 2;
    }

    burst(x, y, 10 + Math.min(score / 5, 14));

    pad.classList.remove("is-hit");
    void pad.offsetWidth;
    pad.classList.add("is-hit");
    setTimeout(function () { pad.classList.remove("is-hit"); }, 70);

    var tps = currentTps();
    if (tps >= 8 && performance.now() - lastComboShow > 400) {
      lastComboShow = performance.now();
      comboPop.textContent = tps + "/s";
      comboPop.classList.remove("show");
      void comboPop.offsetWidth;
      comboPop.classList.add("show");
      floatText(x, y - 20, "+" + tps);
    }

    updateHud();
  }

  function loop(now) {
    if (!running) return;
    left = Math.max(0, DURATION - (now - t0) / 1000);
    updateHud();
    if (left <= 0) {
      endRound();
      return;
    }
    requestAnimationFrame(loop);
  }

  function startRound() {
    ensureAudio();
    running = true;
    score = 0;
    peakTps = 0;
    tapTimes = [];
    left = DURATION;
    t0 = performance.now();
    activePointers = Object.create(null);
    show(playScreen);
    updateHud();
    blip(440, 0.08, "triangle", 0.1);
    requestAnimationFrame(loop);
  }

  function endRound() {
    running = false;
    var isNew = score > best;
    if (isNew) best = score;
    var beatHouse = score >= HOUSE;

    endScore.textContent = String(score);
    endTps.textContent = String(peakTps);
    endBest.textContent = String(best);
    recordBanner.hidden = !isNew;

    if (beatHouse) {
      endTagline.textContent = "You beat the house record. Hands of a courier.";
    } else if (score >= 60) {
      endTagline.textContent = "Fast. Almost courier-tier.";
    } else if (score >= 40) {
      endTagline.textContent = "Solid pace. Go again.";
    } else {
      endTagline.textContent = "Warm-up round. Fingers ready?";
    }

    endSound(isNew || beatHouse);
    show(endScreen);
  }

  // Pointer: multi-touch counts each finger down as a tap
  pad.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!running) return;
    if (activePointers[e.pointerId]) return;
    activePointers[e.pointerId] = true;
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    onTap(e.clientX, e.clientY);
  });

  pad.addEventListener("pointerup", function (e) {
    delete activePointers[e.pointerId];
  });
  pad.addEventListener("pointercancel", function (e) {
    delete activePointers[e.pointerId];
  });

  // Keyboard
  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (!running) {
        if (!endScreen.hidden || !titleScreen.hidden) startRound();
      } else {
        onTap(window.innerWidth / 2, window.innerHeight / 2);
      }
    }
  });

  startBtn.addEventListener("click", function () {
    ensureAudio();
    startRound();
  });
  againBtn.addEventListener("click", startRound);

  // Test hooks
  window.render_game_to_text = function () {
    return JSON.stringify({
      screen: running ? "play" : (!endScreen.hidden ? "end" : "title"),
      score: score,
      best: best,
      left: left,
      peakTps: peakTps
    });
  };
})();
  </script>
</body>
